name: recordatorios
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disparar recordatorios
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/recordatorios"
